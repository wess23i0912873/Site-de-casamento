<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Site oficial de casamento de Wesley &amp; Stefany. Introdução cinematográfica e design editorial minimalista, mobile-first.">
    <title>Wesley &amp; Stefany — Casamento</title>

    <!-- Google Fonts: Cormorant Garamond (Serif elegante para saudações da intro) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&display=swap" rel="stylesheet">

    <!-- CSS File -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ═══════════════════════════════════════════════════════════════════
         PASSO 2 — INTRO SCREEN (Preloader Cinematográfico)
         Overlay fixo, semi-transparente, sobre o Hero.
         ═══════════════════════════════════════════════════════════════════ -->
    <div id="intro-screen" role="presentation" aria-hidden="true">

        <!-- Logo revelada no início -->
        <img
            src="IMAGENS/logo ws.svg"
            alt="Logotipo W&amp;S"
            id="intro-logo"
        >

        <!-- Saudações agrupadas: T1 fica visível e T2 aparece logo abaixo (flex) -->
        <div id="intro-texts-wrapper">

            <!-- Saudação 1: Olá + boas-vindas -->
            <div id="intro-text-1" class="intro-text">
                <p class="greeting-title">Olá</p>
                <p class="greeting-sub">Seja muito bem vindo ao nosso<br>site de casamento!</p>
            </div>

            <!-- Saudação 2: Felicidade — aparece ABAIXO do T1, sem sumir o T1 -->
            <div id="intro-text-2" class="intro-text">
                <p class="greeting-sub">Estamos muito felizes em<br>ter você aqui!</p>
            </div>

        </div>

    </div>

    <!-- ═══════════════════════════════════════════════════════════════════
         PASSO 3 — HERO CAROUSEL + LOGO DECORATIVO
         Container fixo: z-index:1 (atrás da intro, atrás do menu).
         Carrossel automático inicia APENAS após o término da intro.
         ═══════════════════════════════════════════════════════════════════ -->
    <div id="hero-carousel-container" aria-hidden="true">

        <!-- Slides do carrossel (7 fotos reais) -->
        <div id="hero-carousel">
            <div class="hero-slide active"><img src="IMAGENS/FOTOS/hero-1.jpg" alt="" draggable="false"></div>
            <div class="hero-slide"><img src="IMAGENS/FOTOS/hero-2.jpg" alt="" draggable="false"></div>
            <div class="hero-slide"><img src="IMAGENS/FOTOS/hero-3.jpg" alt="" draggable="false"></div>
            <div class="hero-slide"><img src="IMAGENS/FOTOS/hero-4.jpg" alt="" draggable="false"></div>
            <div class="hero-slide"><img src="IMAGENS/FOTOS/hero-5.jpg" alt="" draggable="false"></div>
            <div class="hero-slide"><img src="IMAGENS/FOTOS/hero-6.jpg" alt="" draggable="false"></div>
            <div class="hero-slide"><img src="IMAGENS/FOTOS/hero-7.jpg" alt="" draggable="false"></div>
        </div>

        <!-- Logo decorativo grande — aparece com fade-in ao fim da intro -->
        <img
            src="IMAGENS/logo-wesley-stefany-hero.svg"
            alt="Wesley &amp; Stefany"
            class="hero-logo-reveal"
        >

    </div>

    <!-- ═══════════════════════════════════════════════════════════════════
         PASSO 1 — MENU HORIZONTAL FIXO NO TOPO
         id="main-nav" para controle via JavaScript (oculto durante intro).
         ═══════════════════════════════════════════════════════════════════ -->
    <nav class="editorial-nav" id="main-nav" aria-label="Navegação principal">

        <!-- Logo SVG no canto esquerdo -->
        <a href="#" class="nav-logo" aria-label="Ir para o início">
            <img src="IMAGENS/logo ws.svg" alt="Logotipo W&amp;S" class="logo-img">
        </a>

        <!-- Links horizontais alinhados à direita -->
        <div class="nav-links">
            <a href="#sobre-nos" class="nav-link">Sobre Nós</a>
            <a href="#detalhes" class="nav-link">Detalhes</a>
            <a href="#rsvp" class="nav-link">RSVP</a>
            <a href="#presentes" class="nav-link">Presentes</a>
        </div>

    </nav>

    <!-- Conteúdo Principal (seções futuras serão adicionadas aqui) -->
    <main id="main-content"></main>

    <!-- Script de animação e lógica -->
    <script src="script.js"></script>
</body>
</html>
